<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>巴厘岛 8 天行程地图 · 2026/9/27–10/4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --canvas:#191919; --surface:#202020; --raised:#383836;
    --text:#fff; --text2:rgba(255,255,255,.65); --text3:rgba(255,255,255,.45);
    --border:rgba(255,255,255,.20); --blue:#5E9FE8; --green:#72BC8F; --orange:#DE9255;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--canvas);color:var(--text);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.5}
  #app{display:flex;height:100vh;min-height:560px}
  #map{flex:1 1 auto;height:100%;background:#12212c;position:relative}
  #side{flex:0 0 400px;max-width:400px;height:100%;overflow-y:auto;background:var(--surface);
    border-left:1px solid var(--border);padding:24px 20px 32px}
  h1{font-size:20px;line-height:1.3;margin:0 0 6px}
  .sub{color:var(--text2);font-size:14px;margin-bottom:20px}
  .ttl{font-size:12px;color:var(--text3);letter-spacing:.12em;margin:24px 0 8px;text-transform:uppercase}
  #tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.2}
  .tab .dt{font-size:11px;color:var(--text3)}
  .tab:hover{background:var(--raised)}
  .tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#10202f;font-weight:700}
  .tab.on .dt{color:#10202f;opacity:.75}
  #dayhead{margin:20px 0 12px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;
    background:rgba(94,159,232,.10)}
  #dayhead b{display:block;font-size:16px;margin-bottom:4px}
  #dayhead span{color:var(--text2);font-size:13px}
  .item{display:grid;grid-template-columns:74px 1fr;gap:12px;width:100%;text-align:left;
    min-height:44px;padding:12px 12px 12px 10px;border:0;border-radius:10px;background:transparent;
    color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;position:relative}
  .item + .item{margin-top:2px}
  .item:hover{background:var(--raised)}
  .item:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .item.on{background:rgba(94,159,232,.16);box-shadow:inset 3px 0 0 var(--blue)}
  .item.nogo{cursor:default}
  .item.nogo:hover{background:transparent}
  .tm{color:var(--blue);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px;font-weight:600}
  .it b{display:block;font-size:14.5px;font-weight:600;margin-bottom:3px}
  .it p{margin:0;color:var(--text2);font-size:13px}
  .pin{display:block;color:var(--text3);font-size:12px;font-weight:400;margin-top:3px}
  .star{color:var(--orange)}
  .nav{display:inline-flex;align-items:center;gap:4px;margin-top:7px;font-size:12px;
    color:var(--blue);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:4px 8px}
  .nav:hover{background:var(--raised)}
  .src{min-height:36px;font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);
    background:transparent;color:var(--text2);cursor:pointer;font-family:inherit}
  .src.on{background:var(--blue);border-color:var(--blue);color:#10202f;font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .hint{color:var(--text3);font-size:12px;margin-top:12px}
  #status{position:absolute;left:16px;top:16px;z-index:600;background:rgba(25,25,25,.92);
    border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--orange);
    display:none;max-width:70%}
  .leaflet-popup-content-wrapper{background:#202020;color:#fff;border-radius:10px}
  .leaflet-popup-tip{background:#202020}
  .leaflet-popup-content{font-size:13px;line-height:1.55;margin:12px 14px}
  .leaflet-popup-content a{color:var(--blue)}
  .lbl{background:rgba(25,25,25,.85);border:1px solid var(--border);border-radius:6px;color:#fff;
    font-size:12px;padding:2px 6px;white-space:nowrap;box-shadow:none}
  .lbl.star{background:var(--orange);color:#10202f;border-color:var(--orange);font-weight:700}
  @media (max-width:900px){
    #app{flex-direction:column;height:auto}
    #map{height:52vh;min-height:320px}
    #side{flex:0 0 auto;max-width:none;width:100%;height:auto;border-left:0;border-top:1px solid var(--border);padding:20px 16px 32px}
  }
</style>
</head>

</div>

 {n:8,d:"10/4 周日",c:"#E97366",t:"乌布 → 回程",note:"全部行程 17:00 前结束",

];
var LEGS=[
 {d:1,pts:["dps","canggu","labrisa","batubolong"],boat:0},
 {d:2,pts:["canggu","kuta","seminyak"],boat:0},
 {d:3,pts:["canggu","timbis","melasti","uluwatu"],boat:0},
 {d:4,pts:["canggu","seminyak","sanur"],boat:0},
 {d:5,pts:["sanur","toyapakeh"],boat:1},
 {d:5,pts:["toyapakeh","manta","kling","billabong","toyapakeh"],boat:0},
 {d:5,pts:["toyapakeh","sanur"],boat:1},

 {d:7,pts:["ubud","atv","celuk","ubud"],boat:0},
 {d:8,pts:["ubud","dps"],boat:0}
];
var AMAP="https://wprd0"+"{s}"+".is.autonavi.com/appmaptile";
var SRC=[
 {name:"高德地图",url:AMAP+"?lang=zh_cn&size=1&style=7&x={x}&y={y}&z={z}",sub:"1234",max:18,attr:"高德地图"},
 {name:"高德卫星",url:AMAP+"?style=6&x={x}&y={y}&z={z}",sub:"1234",max:18,attr:"高德地图"},
 {name:"Esri 卫星",url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"+"{z}/{y}/{x}",sub:"abc",max:18,attr:"Esri"},
 {name:"Carto",url:"https://"+"{s}"+".basemaps.cartocdn.com/rastertiles/voyager/"+"{z}/{x}/{y}"+".png",sub:"abcd",max:19,attr:"CARTO / OSM"},
 {name:"OpenStreetMap",url:"https://tile.openstreetmap.org/"+"{z}/{x}/{y}"+".png",sub:"abc",max:18,attr:"OpenStreetMap"}
];
function gmap(p){return "https://www.google.com/maps/search/?api=1&query="+p.ll[0]+","+p.ll[1]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

var state={day:1,markers:{},groups:{},map:null};

function buildTabs(){
  var h="",i;
  for(i=0;i<DAYS.length;i++){
    var d=DAYS[i];
    h+='<button class="tab" data-d="'+d.n+'"><span>D'+d.n+' '+esc(d.t)+'</span><span class="dt">'+esc(d.d)+'</span></button>';
  }
  document.getElementById("tabs").innerHTML=h;
  var b=document.querySelectorAll(".tab"),j;
  for(j=0;j<b.length;j++)(function(el){
    el.addEventListener("click",function(){selectDay(+el.getAttribute("data-d"),1)});
  })(b[j]);
}
function renderDay(n){
  var d=DAYS[n-1],i,h="";
  document.getElementById("dayhead").innerHTML=
    "<b>Day "+d.n+"｜"+esc(d.d)+" · "+esc(d.t)+"</b><span>"+esc(d.note)+"</span>";
  for(i=0;i<d.items.length;i++){
    var it=d.items[i],p=it.k?P[it.k]:null;
    h+='<div class="item'+(p?"":" nogo")+'" '+(p?'tabindex="0" role="button" data-k="'+it.k+'"':"")+'>'+
       '<div class="tm">'+esc(it.tm)+'</div><div class="it"><b>'+esc(it.t)+
       (p?'<span class="pin">📍'+esc(p.name)+"</span>":"")+'</b><p>'+esc(it.s)+"</p>"+
       (p?'<a class="nav" target="_blank" rel="noopener" href="'+gmap(p)+'">↗ 导航</a>':"")+
       "</div></div>";
  }
  document.getElementById("timeline").innerHTML=h;
  var els=document.querySelectorAll(".item[data-k]"),j;
  for(j=0;j<els.length;j++)(function(el){
    function go(e){
      if(e.target&&e.target.className==="nav")return;
      focusPoint(el.getAttribute("data-k"),el);
    }
    el.addEventListener("click",go);
    el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go(e)}});
  })(els[j]);
}
function focusPoint(k,el){
  var cur=document.querySelectorAll(".item.on"),i;
  for(i=0;i<cur.length;i++)cur[i].className="item";
  if(el)el.className="item on";
  var m=state.markers[k];
  if(!state.map||!m)return;
  state.map.flyTo(P[k].ll,14,{duration:.7});
  m.openPopup();
}
function selectDay(n,fit){
  state.day=n;
  var t=document.querySelectorAll(".tab"),i;
  for(i=0;i<t.length;i++)t[i].className=(+t[i].getAttribute("data-d")===n)?"tab on":"tab";
  renderDay(n);
  if(!state.map)return;
  for(var d in state.groups){
    var g=state.groups[d];
    if(+d===n){if(!state.map.hasLayer(g))state.map.addLayer(g)}
    else if(state.map.hasLayer(g))state.map.removeLayer(g);
  }
  var keys=DAYS[n-1].items.map(function(x){return x.k}).filter(Boolean),lls=[];
  for(i=0;i<keys.length;i++)lls.push(P[keys[i]].ll);
  for(var key in state.markers){
    var mk=state.markers[key],act=keys.indexOf(key)>=0;
    mk.setStyle({fillOpacity:act?1:.28,opacity:act?1:.35});
    var tip=mk.getTooltip();if(tip)tip.getElement()&&(tip.getElement().style.opacity=act?1:.35);
  }
  if(fit&&lls.length)state.map.fitBounds(L.latLngBounds(lls).pad(.25),{animate:true});
}
function buildMap(){
  var st=document.getElementById("status");
  function say(m,keep){st.style.display=m?"block":"none";st.innerHTML=m||"";
    if(m&&!keep)setTimeout(function(){st.style.display="none"},4500)}
  if(typeof L==="undefined"){say("地图库加载失败（需要联网），右侧每日行程仍可查看。",1);return}
  var map=L.map("map",{scrollWheelZoom:true}).setView([-8.65,115.25],10);
  state.map=map;
  var i;
  for(i=0;i<DAYS.length;i++)state.groups[DAYS[i].n]=L.layerGroup();
  for(i=0;i<LEGS.length;i++){
    var l=LEGS[i],day=DAYS[l.d-1],lls=[],k;
    for(k=0;k<l.pts.length;k++)lls.push(P[l.pts[k]].ll);
    var o={color:day.c,weight:l.boat?3:4,opacity:.95,lineCap:"round"};
    if(l.boat)o.dashArray="8 8";
    L.polyline(lls,o).bindTooltip("D"+day.n+" "+day.d+" · "+day.t,{sticky:true}).addTo(state.groups[l.d]);
  }
  for(var key in P){
    var p=P[key];
    var m=L.circleMarker(p.ll,{radius:p.star?9:6,color:"#191919",weight:2,
      fillColor:p.star?"#DE9255":"#fff",fillOpacity:1}).addTo(map);
    m.bindPopup("<b>"+esc(p.name)+'</b><br><a target="_blank" rel="noopener" href="'+gmap(p)+'">在 Google 地图打开 ↗</a>');
    m.bindTooltip(p.name,{permanent:true,direction:"right",offset:[8,0],className:p.star?"lbl star":"lbl"});
    state.markers[key]=m;
  }
  var cur=null,timer=null;
  function setSrc(idx,auto){
    if(idx>=SRC.length){say("所有底图源都无法加载，路线与标记仍可使用。",1);return}
    var s=SRC[idx],loaded=0;
    if(cur)map.removeLayer(cur);
    cur=L.tileLayer(s.url,{subdomains:s.sub,maxZoom:s.max,attribution:s.attr});
    cur.on("tileload",function(){loaded++;if(loaded===1){clearTimeout(timer);say("")}});
    cur.addTo(map);
    clearTimeout(timer);
    timer=setTimeout(function(){if(loaded===0){say("「"+s.name+"」加载失败，自动换下一个底图…");setSrc(idx+1,1)}},6000);
    var bs=document.querySelectorAll(".src"),b;
    for(b=0;b<bs.length;b++)bs[b].className=(+bs[b].getAttribute("data-i")===idx)?"src on":"src";
    if(auto)say("已切换到「"+s.name+"」");
  }
  var sh="",j;
  for(j=0;j<SRC.length;j++)sh+='<button class="src" data-i="'+j+'">'+SRC[j].name+"</button>";
  document.getElementById("sources").innerHTML=sh;
  var btns=document.querySelectorAll(".src");
  for(i=0;i<btns.length;i++)(function(b){b.addEventListener("click",function(){setSrc(+b.getAttribute("data-i"),0)})})(btns[i]);
  setSrc(0,0);
  selectDay(1,1);
}
function start(){
  try{buildTabs();selectDay(1,0)}catch(e){}
  try{buildMap()}catch(e){
    var st=document.getElementById("status");st.style.display="block";st.textContent="地图初始化出错："+e.message;}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
</script>
</body>
</html>
